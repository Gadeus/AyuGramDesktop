name: Build Telegram

on:
  workflow_dispatch:

jobs:
  build-telegram:
    runs-on: windows-latest
    timeout-minutes: 720

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: true

      - name: Force sync all submodules
        shell: cmd
        run: |
          echo "Syncing submodules..."
          git submodule sync --recursive
          echo "Updating submodules..."
          git submodule update --init --recursive --force

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          sdk: '10.0.26100.0'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Restore dependencies cache (v12b)
        id: cache-deps
        uses: actions/cache/restore@v4
        with:
          path: |
            ThirdParty
            Libraries/win64
          key: deps-${{ runner.os }}-${{ runner.arch }}-v12b
          restore-keys: |
            deps-${{ runner.os }}-${{ runner.arch }}-v12b

      - name: Fail if dependencies cache not restored
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          echo "ERROR: Dependencies cache v12b not found! Run Build Dependencies first."
          exit /b 1

      - name: Copy dependencies to parent directory
        shell: powershell
        run: |
          $targetRoot = "D:\a\AyuGramDesktop"
          if (Test-Path ThirdParty) { Copy-Item ThirdParty "$targetRoot\ThirdParty" -Recurse -Force -ErrorAction Stop }
          if (Test-Path "Libraries\win64") {
              New-Item "$targetRoot\Libraries\win64" -ItemType Directory -Force | Out-Null
              Copy-Item "Libraries\win64\*" "$targetRoot\Libraries\win64" -Recurse -Force -ErrorAction Stop
          }

      - name: Verify dependencies are ready
        shell: cmd
        run: |
          if not exist "D:\a\AyuGramDesktop\Libraries\win64\Qt-5.15.18\lib\Qt5Core.lib" (
            echo "ERROR: Dependencies missing after copy!"
            exit /b 1
          )
          echo "Dependencies are ready."

      # Убедимся, что Ninja доступен (он уже есть в VS, но на всякий случай сделаем доступным через PATH)
      - name: Ensure Ninja is available
        shell: powershell
        run: |
          $ninjaPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja\ninja.exe"
          if (-not (Test-Path $ninjaPath)) {
              Write-Host "Ninja not found, installing..."
              choco install ninja -y
          } else {
              Write-Host "Ninja found at $ninjaPath"
              echo "$ninjaPath" | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      - name: Set CL_MPCount for MSVC (global)
        shell: cmd
        run: echo CL_MPCount=1 >> %GITHUB_ENV%

      - name: Increase pagefile
        shell: powershell
        run: |
          Write-Host "Configuring pagefile (safe max)..."
          $sys = Get-CimInstance Win32_ComputerSystem
          Set-CimInstance -InputObject $sys -Property @{AutomaticManagedPagefile=$false}
          $pf = Get-CimInstance Win32_PageFileSetting -ErrorAction SilentlyContinue
          $initial = 16384
          $max     = 32768
          if ($pf) {
              Set-CimInstance -InputObject $pf -Property @{
                  InitialSize = $initial
                  MaximumSize = $max
              }
          } else {
              New-CimInstance -ClassName Win32_PageFileSetting -Property @{
                  Name = "C:\\pagefile.sys"
                  InitialSize = $initial
                  MaximumSize = $max
              }
          }
          Write-Host "Pagefile set to 16-32 GB"

      - name: Configure project (Ninja Multi-Config via configure.bat)
        shell: cmd
        run: |
          set "CMAKE_GENERATOR=Ninja Multi-Config"
          cd Telegram
          configure.bat x64 ^
            -B ..\out\win ^
            -D TDESKTOP_API_ID=2040 ^
            -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 ^
            -D TDESKTOP_USE_CRASHPAD=OFF ^
            -D TDESKTOP_DISABLE_AUTOUPDATE=ON ^
            -D CMAKE_BUILD_TYPE=Release ^
            -D CMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF ^
            -D CMAKE_DISABLE_PRECOMPILE_HEADERS=ON ^
            -D CMAKE_CXX_FLAGS="/bigobj /O2 /Ob0 /DNDEBUG /D TDESKTOP_DISABLE_CRASH_REPORTS /D TDESKTOP_DISABLE_UPDATES /d2FH4 /Zm300 /FS" ^
            -D CMAKE_EXE_LINKER_FLAGS="/DEBUG:NONE /LTCG:OFF" ^
            -D CMAKE_VS_GLOBALS="MultiProcessorCompilation=false"
          if errorlevel 1 exit /b 1

      - name: Build (Ninja, single job)
        shell: cmd
        run: |
          cmake --build out\win --config Release -- -j 1
          if errorlevel 1 exit /b 1

      - name: Verify build output
        shell: cmd
        run: |
          if not exist out\win\Release\Telegram.exe (
            echo Build failed: Telegram.exe not found
            exit /b 1
          )
          echo Build successful!

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Windows
          path: out\win\Release
