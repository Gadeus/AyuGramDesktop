name: Build Dependencies

on:
  workflow_dispatch:

jobs:
  build-deps:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: true

      - name: Force sync all submodules
        shell: cmd
        run: |
          echo "Syncing submodules..."
          git submodule sync --recursive
          echo "Updating submodules..."
          git submodule update --init --recursive --force

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          sdk: '10.0.26100.0'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Increase pagefile
        shell: powershell
        run: |
          Write-Host "Configuring pagefile (safe max)..."
          $sys = Get-CimInstance Win32_ComputerSystem
          Set-CimInstance -InputObject $sys -Property @{AutomaticManagedPagefile=$false}
          $pf = Get-CimInstance Win32_PageFileSetting -ErrorAction SilentlyContinue
          $initial = 16384
          $max     = 32768
          if ($pf) {
              Set-CimInstance -InputObject $pf -Property @{
                  InitialSize = $initial
                  MaximumSize = $max
              }
          } else {
              New-CimInstance -ClassName Win32_PageFileSetting -Property @{
                  Name = "C:\\pagefile.sys"
                  InitialSize = $initial
                  MaximumSize = $max
              }
          }
          Write-Host "Pagefile set to 16-32 GB"

      - name: Restore dependencies cache (v12b)
        id: cache-deps
        uses: actions/cache/restore@v4
        with:
          path: |
            ThirdParty
            Libraries/win64
          key: deps-${{ runner.os }}-${{ runner.arch }}-v12b
          restore-keys: |
            deps-${{ runner.os }}-${{ runner.arch }}-v12b

      - name: Check if dependencies exist
        id: check-deps
        shell: cmd
        run: |
          if exist "Libraries\win64\Qt-5.15.18\lib\Qt5Core.lib" (
            echo Dependencies found, skipping win.bat
            echo deps_ready=true>> %GITHUB_OUTPUT%
          ) else (
            echo Dependencies NOT found, need to build
            echo deps_ready=false>> %GITHUB_OUTPUT%
          )

      - name: Prepare build environment (if needed)
        if: steps.check-deps.outputs.deps_ready == 'false'
        shell: cmd
        run: |
          echo Preparing build environment...
          cd Telegram\build\prepare
          win.bat
          if errorlevel 1 exit /b 1

      - name: Copy dependencies from parent to workspace
        shell: powershell
        run: |
          if (Test-Path ..\ThirdParty) { Copy-Item ..\ThirdParty ThirdParty -Recurse -Force }
          if (Test-Path ..\Libraries\win64) {
              New-Item Libraries\win64 -ItemType Directory -Force | Out-Null
              Copy-Item ..\Libraries\win64\* Libraries\win64 -Recurse -Force
          }

      - name: Remove temporary and debug files (safe)
        shell: cmd
        run: |
          echo Cleaning up Libraries\win64...
          set "ROOT=%~dp0.."
          rem 1. Remove Qt build duplicate
          if exist "%ROOT%\Libraries\win64\qt_5.15.18" rmdir /s /q "%ROOT%\Libraries\win64\qt_5.15.18"
          rem 2. In Qt-5.15.18, keep only lib, plugins, include, bin, mkspecs
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$qt='%ROOT%\Libraries\win64\Qt-5.15.18'; if (Test-Path $qt) { $exclude = @('lib','plugins','include','bin','mkspecs'); Get-ChildItem $qt -Directory | Where-Object { $exclude -notcontains $_.Name } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue }"
          rem 3. In other libs, remove Debug and out\debug-static
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$libs='%ROOT%\Libraries\win64'; Get-ChildItem $libs -Directory | Where-Object { $_.Name -ne 'local' -and $_.Name -ne 'Qt-5.15.18' } | ForEach-Object { $d=$_.FullName; @('Debug','out\debug-static') | ForEach-Object { $p=Join-Path $d $_; if (Test-Path $p) { Remove-Item $p -Recurse -Force -ErrorAction SilentlyContinue } } }"
          rem 4. Remove known junk folders
          if exist "%ROOT%\Libraries\win64\breakpad" rmdir /s /q "%ROOT%\Libraries\win64\breakpad"
          rem 5. Remove all object files, PDB, ILK, EXP, etc.
          cd "%ROOT%\Libraries\win64"
          del /s /q *.obj 2>nul
          del /s /q *.pdb 2>nul
          del /s /q *.ilk 2>nul
          del /s /q *.exp 2>nul
          del /s /q *.log 2>nul
          del /s /q *.tlog 2>nul
          del /s /q *.lastbuildstate 2>nul
          cd %ROOT%
          echo Done.

      - name: Save dependencies cache (v12b)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ThirdParty
            Libraries/win64
          key: deps-${{ runner.os }}-${{ runner.arch }}-v12b
